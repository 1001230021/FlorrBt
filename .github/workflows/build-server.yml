name: Build server

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-ids-sync:
    name: Shared enum -> JS ids in sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Regenerate client ids from C++ enums
        run: node tools/generate_shared_ids.js

      - name: Fail if generated ids changed
        run: |
          if ! git diff --exit-code -- web/src/generated_ids.js; then
            echo "::error::web/src/generated_ids.js is out of date."
            echo "Run 'node tools/generate_shared_ids.js' locally and commit the result."
            exit 1
          fi

  client-deps-ratchet:
    name: Client import cycles must not grow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check client dependency ratchet
        run: node tools/check_client_deps.mjs

  client-input-tests:
    name: Client input binding tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run input hold regression tests
        run: node tools/test_input_holds.mjs

  web-bridge-tests:
    name: Web bridge unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run bridge tests
        run: node --test tests/web_bridge/test_bridge.test.mjs

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            platform: linux-x64
            executable: build/FlorrBt_Server
          - name: Windows x64
            os: windows-latest
            platform: windows-x64
            executable: build/Release/FlorrBt_Server.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1-mesa-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libharfbuzz-dev \
            libjansson-dev \
            libmariadb-dev \
            libmbedtls-dev \
            libssh2-1-dev \
            libudev-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            xorg-dev

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: vcpkg install jansson:x64-windows-static

      - name: Configure Linux build
        if: runner.os == 'Linux'
        shell: bash
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=OFF

      - name: Configure Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 `
            -DBUILD_SHARED_LIBS=OFF `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Build server
        run: cmake --build build --config Release --target FlorrBt_Server --parallel

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/FlorrBt_Server | Out-Null
          Copy-Item "${{ matrix.executable }}" package/FlorrBt_Server/
          Copy-Item data package/FlorrBt_Server/data -Recurse

      - name: Upload server artifact
        uses: actions/upload-artifact@v7
        with:
          name: FlorrBt-Server-${{ matrix.platform }}
          path: package/FlorrBt_Server
          if-no-files-found: error
          retention-days: 14
